name: LiftKit

# Generated project (XcodeGen), matching RunKit and FuelKit. The checked-in
# LiftKit.xcodeproj it replaces was hand-maintained, which made adding a target —
# specifically the watch app — impractical without a Mac. See docs/WATCH-APP.md.
#
# Regenerate after changing this file, or after adding/removing source files:
#     xcodegen generate
# CI does it automatically before building.
#
# LiftKit.xcodeproj is generated and gitignored — this file is the source of truth.

options:
  bundleIdPrefix: com.ferrixguild
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    # CI rewrites the version into Info.plist directly on every build, so this is
    # not load-bearing there — but keep it in sync anyway: a stale value misleads
    # anyone reading the repo, and it IS used by a local build.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No DEVELOPMENT_TEAM here on purpose. The old project carried an empty string,
    # and an empty string is still a value — it would override what
    # `xcode-project use-profiles` writes per target during the signed build.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LiftKit:
    type: application
    platform: iOS
    sources:
      - path: LiftKit
    dependencies:
      - target: LiftKitWidgets
        embed: true
      # NOT YET EMBEDDED. Turning this on makes the watch app part of the archive,
      # which means the signed build needs a provisioning profile for
      # com.ferrixguild.liftkit.watchkitapp — an App ID that doesn't exist yet
      # (the developer account is locked). Embedding it early would break a
      # currently-green TestFlight pipeline for no gain, so the target is built and
      # compile-checked on its own scheme until the App ID exists.
      #
      # When enabling: `copy` is required. Without the explicit subpath XcodeGen
      # embeds a watch app like a framework and the archive fails validation.
      # - target: LiftKitWatch
      #   embed: true
      #   copy:
      #     destination: productsDirectory
      #     subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
      # Explicitly linked in the old project. Swift would import most of these
      # implicitly, but dropping them here would be a silent change to what the
      # binary links, so they are carried over as-is.
      - sdk: Charts.framework
      - sdk: AuthenticationServices.framework
      - sdk: UserNotifications.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.liftkit
        INFOPLIST_FILE: LiftKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiftKit/LiftKit.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  LiftKitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LiftKitWidgets
      # Member of both targets in the old project: the Live Activity's attributes
      # are declared once and compiled into the app and the extension, so the two
      # cannot disagree about the activity's shape.
      - path: LiftKit/Services/LiftKitActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.liftkit.widgets
        INFOPLIST_FILE: LiftKitWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # The watch app will eventually run the workout itself, so it links the real
  # timer config rather than a parallel copy. These files are listed one by one
  # rather than globbing a folder: most of LiftKit/ imports SwiftData or UIKit and
  # will not compile for watchOS, so membership has to be a deliberate, reviewable
  # list.
  LiftKitWatch:
    type: application
    platform: watchOS
    sources:
      - path: LiftKitWatch
      - path: LiftKit/Shared/WatchMenu.swift            # the menu wire format
      - path: LiftKit/Shared/WatchWorkoutPayload.swift  # the finished-workout wire format
      - path: LiftKit/Shared/WorkoutOwner.swift         # stops both devices recording one workout
      - path: LiftKit/Shared/TimerConfig.swift    # one definition of what an EMOM is
      - path: LiftKit/Enums/TimerType.swift
      - path: LiftKit/Enums/WeightUnit.swift      # WeightUnit + UnitSystem + DistanceUnit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.liftkit.watchkitapp
        INFOPLIST_FILE: LiftKitWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiftKitWatch/LiftKitWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Overrides the "1,2" in settings.base. Inheriting it silently produces a
        # watch app that will not install.
        TARGETED_DEVICE_FAMILY: "4"

  LiftKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiftKitTests
    dependencies:
      - target: LiftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.liftkit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_STYLE: Automatic

  LiftKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiftKitUITests
    dependencies:
      - target: LiftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferrixguild.liftkit.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  # CI builds `-scheme LiftKit`, so this name is load-bearing.
  LiftKit:
    build:
      targets:
        LiftKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftKitTests
        - LiftKitUITests
    archive:
      config: Release

  # Its own scheme so the watch code is compiled on every CI run even though it
  # isn't embedded in the app yet — otherwise it would rot unnoticed until the
  # App ID exists.
  LiftKitWatch:
    build:
      targets:
        LiftKitWatch: all
    run:
      config: Debug
    archive:
      config: Release
